<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User profile</title>
    <link rel="stylesheet" href="Styling/user-card.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="profile-card">
        <div class="img-card">
          <img
            src="media/assets/images/user.jpeg"
            height="130"
            width="130"
            alt=""
          />
        </div>
        <div class="card-title">
          <h3>John Snow</h3>
          <p>UI/UX Designer</p>
        </div>
        <div class="cta">
          <button class="message">Message</button>
          <button class="following">Following</button>
        </div>
        <div class="social-icons">
          <i class="fb fa-brands fa-facebook"></i>
          <i class="tw fa-brands fa-twitter"></i>
          <i class="pint fa-brands fa-pinterest"></i>
          <i class="google fa-brands fa-google-plus"></i>
        </div>
      </div>
    </div>
  </body>
</html>
