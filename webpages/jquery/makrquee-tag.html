<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #news {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <marquee id="news">This is my first news</marquee>

    <script src="jquery-3.7.js"></script>
    <script>
      $(document).ready(function () {
        $("#news").hover(
          function () {
            this.stop();
          },
          function () {
            this.start();
          }
        );
      });
    </script>
  </body>
</html>
