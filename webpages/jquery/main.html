<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p>
        This is sample text tag.
    </p>
    <input type="text" id="text1">

    <button id="btn">Get Text</button>
    <!-- jq -->
    <script src="jquery-3.7.js"></script>

    <script>
        $(document).ready( function (){

            let paragraph = $('p').text().trim();
            console.log(paragraph);
            // alert("This is jquery");
            $('#btn').on('click', function (){
                let text1 = $('#text1').val();
                console.log(text1);
            })
        })
    </script>
    
</body>
</html>
