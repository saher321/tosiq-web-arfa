<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        button{
            height: 30px;
            cursor: pointer;
            position: relative;
            background-color: transparent;
        }
        button::before{
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            background-color: greenyellow;
            height: 28px;
            width: 0px;
            z-index: -1;
            transition: .3s;
        }
        button:hover::before{
            width: 85px;            
        }

    </style>
</head>
<body>
    <button>Hover Effect</button>
</body>
</html>
